name: build-installers

# Builds downloadable installers when you push a tag like v0.1.0,
# and attaches them to a GitHub Release. Users just download - no scripts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps + PyInstaller
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
      - name: Bundle Chromium into the playwright package
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium
      - name: Build app (PyInstaller)
        run: >
          pyinstaller vb.py --name VirtualBuddy --noconfirm --windowed
          --collect-submodules buddy --collect-submodules tools
          --collect-all playwright --collect-all webview
          --hidden-import run --hidden-import app
          --hidden-import pyperclip --hidden-import pygetwindow
          --add-data "assets;assets" --add-data "config.yaml;."
          --add-data "buddy/dashboard/index.html;buddy/dashboard"
      - name: Build Windows installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\VirtualBuddy.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: packaging/windows/Output/*.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: packaging/windows/Output/*.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps + PyInstaller
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
      - name: Bundle Chromium into the playwright package
        run: |
          PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
      - name: Build app (PyInstaller)
        run: >
          pyinstaller vb.py --name VirtualBuddy --noconfirm --windowed
          --collect-submodules buddy --collect-submodules tools
          --collect-all playwright --collect-all webview
          --hidden-import run --hidden-import app
          --hidden-import pyperclip --hidden-import pygetwindow
          --add-data "assets:assets" --add-data "config.yaml:."
          --add-data "buddy/dashboard/index.html:buddy/dashboard"
      - name: Package (tar.gz)
        run: |
          cd dist && tar czf VirtualBuddy-linux.tar.gz VirtualBuddy && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: linux-build, path: dist/VirtualBuddy-linux.tar.gz }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/VirtualBuddy-linux.tar.gz }
