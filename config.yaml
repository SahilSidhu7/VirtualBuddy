# VirtualBuddy settings - edit here or in the control panel (python app.py)
wake_word: buddy
character: duck            # duck | robot | crab | elf  (or your own folder in assets/character/)
match_threshold: 0.4
speak_replies: true
claude_cli: claude
workspace: ./workspace
# Local brain (Ollama)
llm_enabled: true
llm_model: qwen2.5:latest
ollama_url: http://localhost:11434
embed_model: nomic-embed-text   # for intent matching (light, via Ollama)
power_save: false
# PC <-> mobile <-> PC sync (LAN command server)
server_port: 8770
server_token: changeme      # CHANGE THIS - required from phone/other PCs
# Other machines buddy can send commands to. Short form or full form with nicknames:
#   peers:
#     laptop: "http://192.168.1.55:8770"
#     gaming-pc:
#       url: "http://192.168.1.42:8770"
#       aliases: ["big pc", "the rig"]
peers: {}
default_peer: ""            # peer used when a remote command names no machine (blank = ask)
# Auto-update on launch (git checkout only). Manual: "Update now" in the dashboard.
auto_update: false
# Command-graph memory: reuse the skill that worked for a similar past command.
command_memory: true
# Projects buddy scans for "my projects" / run / status
projects_dirs: []           # e.g. [ "C:/Projects", "C:/Users/sahil/dev" ]  (empty = auto)
# Notion (optional) - save ideas. See buddy/skills/notion.py for setup
notion_token: ""
notion_db: ""
